trigger:
  branches:
    include:
      - azure-pipelines

resources:
  repositories:
    - repository: GitHub   # an internal alias
      type: github
      name: kaoutheeramdouni/Site5g-PFE
      ref: refs/heads/azure-pipelines
      endpoint: GitHub  # GitHub service connection in DevOps

pool:
  name: 'Default'  # your self-hosted agent pool

variables:
  imageName: 'kaoutheeramdouni/site5g'
  imageTag: '$(Build.BuildId)'
  fullImageName: 'acrpfe2025uvt.azurecr.io/$(imageName):$(imageTag)'

steps:
# 1️⃣ Checkout GitHub repo
- checkout: GitHub
  displayName: 'Checkout GitHub repository'


# 2️⃣ Build Docker Image
- task: Docker@2
  displayName: 'Build Docker Image'
  inputs:
    containerRegistry: 'acr-test'
    repository: '$(imageName)'
    command: 'build'
    dockerfile: 'Dockerfile'  # adjust if your Dockerfile is in a subfolder
    buildContext: '.'
    tags: |
      $(imageTag)

# 3️⃣ Scan Docker Image with Trivy (local image)
- script: |
    # Installer Trivy si ce n'est pas déjà fait
    if ! command -v trivy &> /dev/null; then
      wget https://github.com/aquasecurity/trivy/releases/download/v0.67.1/trivy_0.67.1_Linux-64bit.deb
      sudo dpkg -i trivy_0.67.1_Linux-64bit.deb
    fi

    # Scanner l'image locale juste construite
    trivy image --exit-code 1 --no-progress $(imageName):$(imageTag)
  displayName: 'Scan local Docker image with Trivy'

# 3️⃣ Push Docker Image to DockerHub
- task: Docker@2
  displayName: 'Push Docker Image'
  inputs:
    containerRegistry: 'acr-test'
    repository: '$(fullImageName)'
    command: 'push'
    tags: |
      $(imageTag)

# 1️⃣ Déployer MySQL
- task: Kubernetes@1
  displayName: 'Deploy MySQL'
  inputs:
    connectionType: 'Kubernetes Service Connection'
    kubernetesServiceEndpoint: 'AKS_ENGINE-NEW'
    namespace: 'default'
    command: 'apply'
    useConfigurationFile: true
    configuration: 'K8s/mysql-deployment.yaml'
    
# 4️⃣ Déployer sur AKS Engine
- task: Kubernetes@1
  displayName: 'Deploy to AKS Engine'
  inputs:
    connectionType: 'Kubernetes Service Connection'
    kubernetesServiceEndpoint: 'AKS_ENGINE-NEW'  # Service connection AKS Engine
    namespace: 'default'
    command: 'apply'
    useConfigurationFile: true
    configuration: 'K8s/deployment.yaml'

    # Mise à jour dynamique de l'image
- task: Kubernetes@1
  displayName: 'Update image'
  inputs:
    connectionType: 'Kubernetes Service Connection'
    kubernetesServiceEndpoint: 'AKS_ENGINE-NEW'
    namespace: 'default'
    command: 'set'
    arguments: 'image deployment/site5g-deployment site5g-container=$(fullImageName)'
