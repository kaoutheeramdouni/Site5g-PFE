apiVersion: apps/v1
kind: Deployment
metadata:
  name: site5g-deployment
  labels:
    app: site5g
spec:
  replicas: 2
  selector:
    matchLabels:
      app: site5g
  template:
    metadata:
      labels:
        app: site5g
    spec:
      containers:
        - name: site5g-container
          image: acrpfe2025uvt.azurecr.io/kaoutheeramdouni/site5g:latest
          ports:
            - containerPort: 80
          env:
            - name: DB_HOST
              value: "mysql-service"
            - name: DB_USER
              value: "site5guser"
            - name: DB_PASSWORD
              value: "Site5gPass123"
            - name: DB_NAME
              value: "site5g"
      imagePullSecrets:
        - name: acr-secret

---
apiVersion: v1
kind: Service
metadata:
  name: site5g-service
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app: site5g
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
